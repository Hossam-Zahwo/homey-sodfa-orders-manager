name: Verify Next.js dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://test.neonauth.invalid/orders_manager/auth
      NEON_AUTH_COOKIE_SECRET: only-for-github-ci-do-not-use-in-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
